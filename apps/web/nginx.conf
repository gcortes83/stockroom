resolver 127.0.0.11 valid=10s ipv6=off;

upstream gateway_upstream {
  zone gateway_upstream 64k;
  server gateway:3000 resolve;
  keepalive 64;
  keepalive_timeout 60s;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 6m;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /api/ {
    proxy_pass http://gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    expires epoch;
    try_files $uri /index.html;
  }
}
