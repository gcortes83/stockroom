name: stockroom

x-service: &service
  restart: unless-stopped
  environment: &service-env
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    AMQP_URL: amqp://stockroom:stockroom@rabbitmq:5672
    OTEL_ENABLED: ${OTEL_ENABLED:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  catalog:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: catalog
    image: stockroom/catalog:local
    environment:
      <<: *service-env
      PORT: 3001
      OTEL_SERVICE_NAME: catalog
      DATABASE_URL: postgresql://catalog:catalog@postgres:5432/catalog_db
      RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-600}
      SEED_ON_START: ${SEED_ON_START:-true}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  orders:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: orders
    image: stockroom/orders:local
    environment:
      <<: *service-env
      PORT: 3002
      OTEL_SERVICE_NAME: orders
      DATABASE_URL: postgresql://orders:orders@postgres:5432/orders_db
      CATALOG_URL: http://catalog:3001
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  payments:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: payments
    image: stockroom/payments:local
    environment:
      <<: *service-env
      PORT: 3003
      OTEL_SERVICE_NAME: payments
      DATABASE_URL: postgresql://payments:payments@postgres:5432/payments_db
      PAYMENT_SIMULATED_LATENCY_MS: ${PAYMENT_SIMULATED_LATENCY_MS:-800}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  gateway:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: gateway
    image: stockroom/gateway:local
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: gateway
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      CATALOG_URL: http://catalog:3001
      ORDERS_URL: http://orders:3002
      PAYMENTS_URL: http://payments:3003
    depends_on:
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy
      payments:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: stockroom/web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_HTTP_PORT:-4318}:4318"

volumes:
  pgdata:
  rabbitdata:
